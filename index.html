<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Message For You ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Card Container */
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(220, 38, 38, 0.2);
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    h1 {
      color: #e11d48;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    p {
      color: #4b5563;
      font-size: 1.1rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    /* Buttons */
    .btn {
      background-color: #e11d48;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
      transition: background-color 0.2s, transform 0.2s;
    }

    .btn:hover {
      background-color: #be123c;
      transform: scale(1.05);
    }

    /* Screen Transitions */
    .hidden {
      display: none !important;
    }

    /* Page 2 - Main Confession */
    .heart-icon {
      font-size: 4rem;
      animation: pulse 1.2s infinite alternate;
      margin-bottom: 10px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.18); }
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      height: 60px;
    }

    #screen2 {
      overflow: visible;
    }

    .screen2-inner {
      position: relative;
      z-index: 2;
    }

    .bunny-pop {
      position: absolute;
      left: 50%;
      bottom: -110px;
      width: 360px;
      height: 320px;
      transform: translateX(-50%) scale(0.2) translateY(80px);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      filter: drop-shadow(0 18px 18px rgba(225, 29, 72, 0.12));
      transition: transform 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.35s ease;
    }

    .bunny-pop.show {
      opacity: 1;
      transform: translateX(-50%) scale(1) translateY(0);
    }

    .bunny {
      position: relative;
      width: 100%;
      height: 100%;
      animation: bunnyBounce 2.6s ease-in-out infinite;
    }

    @keyframes bunnyBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .bunny .body {
      position: absolute;
      left: 50%;
      bottom: 12px;
      width: 290px;
      height: 220px;
      transform: translateX(-50%);
      background: #fffaf8;
      border: 10px solid #a05d32;
      border-radius: 46% 46% 42% 42% / 46% 46% 54% 54%;
      box-shadow: inset 0 -16px 0 rgba(245, 203, 211, 0.2);
    }

    .bunny .ear {
      position: absolute;
      top: 18px;
      width: 72px;
      height: 118px;
      background: #fffaf8;
      border: 10px solid #a05d32;
      border-radius: 50% 50% 45% 45%;
      z-index: 0;
    }

    .bunny .ear::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 14px;
      width: 32px;
      height: 54px;
      background: #f8b3c0;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .bunny .ear-left { left: 70px; transform: rotate(-10deg); }
    .bunny .ear-right { right: 70px; transform: rotate(10deg); }

    .bunny .head {
      position: absolute;
      left: 50%;
      top: 64px;
      width: 250px;
      height: 180px;
      transform: translateX(-50%);
      background: #fffaf8;
      border: 10px solid #a05d32;
      border-radius: 56% 56% 50% 50%;
      z-index: 1;
    }

    .bunny .eye {
      position: absolute;
      top: 120px;
      width: 22px;
      height: 22px;
      background: #3d2b1f;
      border-radius: 50%;
      z-index: 3;
    }

    .bunny .eye.left { left: 132px; }
    .bunny .eye.right { right: 132px; }

    .bunny .cheek {
      position: absolute;
      top: 138px;
      width: 28px;
      height: 22px;
      background: #f4b4c2;
      border-radius: 50%;
      z-index: 2;
    }

    .bunny .cheek.left { left: 82px; }
    .bunny .cheek.right { right: 82px; }

    .bunny .smile {
      position: absolute;
      left: 50%;
      top: 148px;
      width: 64px;
      height: 30px;
      border: 7px solid #a05d32;
      border-top: 0;
      border-left: 0;
      border-right: 0;
      border-radius: 0 0 40px 40px;
      transform: translateX(-50%);
      z-index: 3;
    }

    .bunny .paw {
      position: absolute;
      bottom: 0;
      width: 90px;
      height: 85px;
      background: #fffaf8;
      border: 10px solid #a05d32;
      border-radius: 50% 50% 45% 45%;
      z-index: 1;
    }

    .bunny .paw.left { left: 64px; }
    .bunny .paw.right { right: 64px; }

    .bunny .heart {
      position: absolute;
      width: 28px;
      height: 28px;
      background: #f7bad0;
      transform: rotate(-45deg);
      border-radius: 8px 0 8px 0;
      animation: floatHeart 1.8s ease-in-out infinite;
      opacity: 0.9;
    }

    .bunny .heart::before,
    .bunny .heart::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      background: inherit;
      border-radius: 50%;
    }

    .bunny .heart::before { top: -14px; left: 0; }
    .bunny .heart::after { left: 14px; top: 0; }

    .bunny .heart.one { left: 280px; top: 60px; animation-delay: 0s; }
    .bunny .heart.two { right: 12px; top: 120px; animation-delay: 0.3s; }
    .bunny .heart.three { left: 30px; top: 150px; animation-delay: 0.6s; }

    @keyframes floatHeart {
      0%, 100% { transform: rotate(-45deg) translateY(0) scale(1); }
      50% { transform: rotate(-45deg) translateY(-12px) scale(1.08); }
    }

    #no-btn {
      background-color: #9ca3af;
      box-shadow: 0 4px 15px rgba(156, 163, 175, 0.4);
      position: absolute;
      left: 55%;
      top: 0;
      transition: left 0.15s ease, top 0.15s ease;
    }

    #yes-btn {
      position: absolute;
      right: 55%;
      top: 0;
    }

    /* Success Page */
    .celebrate {
      font-size: 1.3rem;
      color: #be123c;
      font-weight: bold;
    }
    /* speech bubble above the button */
    .bubble{
      position:absolute;
      padding:8px 12px;
      border-radius:12px;
      background:#ffffff;
      color:#111827;
      font-size:13px;
      box-shadow:0 8px 24px rgba(0,0,0,0.12);
      pointer-events:none;
      opacity:0;transform:translateY(6px);transition:opacity .16s ease,transform .16s ease;z-index:80
    }
    .bubble::after{
      content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #ffffff;width:0;height:0
    }
  </style>
</head>
<body>

  <!-- Screen 1: Opening Envelope/Message -->
  <div id="screen1" class="card">
    <div class="heart-icon">✉️</div>
    <h1>Hey there...</h1>
    <p>I’ve been wanting to tell you something important for a while now.</p>
    <button class="btn" onclick="openConfession()">Click to open ❤️</button>
  </div>

  <!-- Screen 2: Valentine Confession Page -->
  <div id="screen2" class="card hidden">
    <div id="bunny-pop" class="bunny-pop" aria-hidden="true">
      <div class="bunny">
        <div class="ear ear-left"></div>
        <div class="ear ear-right"></div>
        <div class="head"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="smile"></div>
        <div class="paw left"></div>
        <div class="paw right"></div>
        <div class="body"></div>
        <div class="heart one"></div>
        <div class="heart two"></div>
        <div class="heart three"></div>
      </div>
    </div>

    <div class="screen2-inner">
      <div class="heart-icon">💖</div>
      <h1>Will you be my girlfriend?</h1>
      <p>You make every day brighter, and I'd love nothing more than to make it official!</p>
      
      <div class="btn-group" id="btn-container">
        <button id="yes-btn" class="btn" onclick="acceptProposal()">Yes!</button>
        <button id="no-btn" class="btn">No</button>
      </div>
    </div>
  </div>

  <!-- Screen 3: Final Celebration Page -->
  <div id="screen3" class="card hidden">
    <div class="heart-icon">🎉🥰✨</div>
    <h1>Yay! I knew it!</h1>
    <p class="celebrate">You've made me the happiest person today! ❤️</p>
  </div>

  <script>
    function openConfession() {
      document.getElementById('screen1').classList.add('hidden');
      document.getElementById('screen2').classList.remove('hidden');
    }

    function acceptProposal() {
      document.getElementById('screen2').classList.add('hidden');
      document.getElementById('screen3').classList.remove('hidden');
    }

    // Magnetic / Repelling "No" Button Logic
    const noBtn = document.getElementById('no-btn');
    const container = document.getElementById('screen2');

    document.addEventListener('mousemove', (e) => {
      // Only run when screen2 is visible
      if (container.classList.contains('hidden')) return;

      const btnRect = noBtn.getBoundingClientRect();
      const btnCenterX = btnRect.left + btnRect.width / 2;
      const btnCenterY = btnRect.top + btnRect.height / 2;

      // Distance between mouse cursor and button center
      const distance = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

      // Trigger repelling behavior when the cursor comes within 100px
      if (distance < 100) {
        moveButtonAwayFrom(e.clientX, e.clientY);
      }
    });

    // Messages to show after each failed click
    const failMessages = [
      "hehe try to catch up kiddo",
      "come on baby gurl cant click yes",
      "at last say yes cutie"
    ];
    let failIndex = 0;

    function showBubbleAbove(buttonEl, msg){
      // remove existing bubbles
      const existing = container.querySelector('.bubble'); if(existing) existing.remove();
      const bubble = document.createElement('div'); bubble.className='bubble'; bubble.textContent = msg; container.appendChild(bubble);
      // compute position relative to container
      const cRect = container.getBoundingClientRect(); const bRect = buttonEl.getBoundingClientRect();
      const localBtnX = bRect.left - cRect.left; const localBtnY = bRect.top - cRect.top;
      // position after append to measure
      requestAnimationFrame(()=>{
        const bw = bubble.offsetWidth; const bh = bubble.offsetHeight;
        let left = localBtnX + (bRect.width/2) - (bw/2);
        left = Math.max(8, Math.min(left, cRect.width - bw - 8));
        let top = localBtnY - bh - 10; if(top < 8) top = 8; // don't go above card
        bubble.style.left = left + 'px'; bubble.style.top = top + 'px';
        bubble.style.opacity = '1'; bubble.style.transform = 'translateY(0)';
        setTimeout(()=>{ bubble.style.opacity = '0'; bubble.style.transform = 'translateY(6px)'; setTimeout(()=> bubble.remove(),220); }, 1600);
      });
    }

    function showBubbleOverSection(sectionEl, msg){
      // remove existing bubbles
      const existing = container.querySelector('.bubble'); if(existing) existing.remove();
      const bubble = document.createElement('div'); bubble.className='bubble'; bubble.textContent = msg; sectionEl.appendChild(bubble);
      requestAnimationFrame(()=>{
        const sRect = sectionEl.getBoundingClientRect(); const bw = bubble.offsetWidth; const bh = bubble.offsetHeight;
        let left = (sRect.width/2) - (bw/2);
        left = Math.max(8, Math.min(left, sRect.width - bw - 8));
        let top = 12; // inside the top of the section
        bubble.style.left = left + 'px'; bubble.style.top = top + 'px';
        bubble.style.opacity = '1'; bubble.style.transform = 'translateY(0)';
        setTimeout(()=>{ bubble.style.opacity = '0'; bubble.style.transform = 'translateY(6px)'; setTimeout(()=> bubble.remove(),220); }, 1600);
      });
    }

    function moveButtonAwayFrom(mouseX, mouseY){
      const containerRect = container.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const localMouseX = mouseX - containerRect.left;
      const localMouseY = mouseY - containerRect.top;
      const padding = 12;
      const minDistance = 120;
      const maxX = Math.max(10, containerRect.width - btnRect.width - 10);
      const maxY = Math.max(10, containerRect.height - btnRect.height - 10);
      const minY = 60; // keep away from header/title area

      // try random positions that are at least minDistance away and within bounds
      for(let i=0;i<40;i++){
        const nx = Math.random() * (maxX - padding) + padding;
        const ny = Math.random() * (maxY - minY) + minY;
        const dx = nx - localMouseX; const dy = ny - localMouseY;
        if(Math.hypot(dx,dy) >= minDistance){ noBtn.style.position='absolute'; noBtn.style.left = nx+'px'; noBtn.style.top = ny+'px'; return; }
      }

      // fallback: place on opposite side but clamp within bounds
      const centerX = containerRect.width/2; const centerY = containerRect.height/2;
      let nx = centerX + (centerX - localMouseX); let ny = centerY + (centerY - localMouseY);
      nx = Math.max(10, Math.min(maxX, nx)); ny = Math.max(minY, Math.min(maxY, ny));
      noBtn.style.position='absolute'; noBtn.style.left = nx+'px'; noBtn.style.top = ny+'px';
    }

    const bunnyPop = document.getElementById('bunny-pop');

    function triggerBunnyPop() {
      bunnyPop.classList.remove('show');
      void bunnyPop.offsetWidth;
      bunnyPop.classList.add('show');
      setTimeout(() => {
        bunnyPop.classList.remove('show');
      }, 1800);
    }

    // clicking No is a "failed attempt" — show a message and move the button
    noBtn.addEventListener('click', (ev)=>{
      ev.preventDefault(); ev.stopPropagation();
      const msg = failMessages[failIndex % failMessages.length];
      failIndex++;
      showBubbleOverSection(container, msg);
      moveButtonAwayFrom(ev.clientX, ev.clientY);
      triggerBunnyPop();
    });
  </script>
</body>
</html>
